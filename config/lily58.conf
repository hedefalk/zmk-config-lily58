# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# nice!view display via nice-view-gem (custom status screen)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Battery: the nice!view is a SHARP memory LCD -- a static image is almost free,
# but the peripheral's spinning-diamond animation redraws every frame and keeps
# that half awake. Disable it (gem then shows a single static frame instead).
CONFIG_NICE_VIEW_GEM_ANIMATION=n
